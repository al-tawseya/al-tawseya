services:
  - type: web
    name: al-tawseya-premium-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --bind 0.0.0.0:$PORT --conf gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_API_KEY
        sync: false   # يُضبط من لوحة Render فقط — لا يُلتزم في Git أبدًا
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
